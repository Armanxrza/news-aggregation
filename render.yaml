services:
  # ============================================================================
  # 1. SajhaNews Backend API (FastAPI / Python)
  # ============================================================================
  - type: web
    name: sajhanews-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python -m scripts.seed"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: FRAMING_ENABLED
        value: "false"
      - key: ANALYZE_ON_CRAWL
        value: "false"
      - key: EVENT_RERANKER_ENABLED
        value: "false"
      - key: NEPALI_NER_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://sajhanews-frontend.onrender.com"
      - key: ADMIN_AUTH_DISABLED
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_CRAWL_SCHEDULER
        value: "true"

  # ============================================================================
  # 2. SajhaNews Frontend Web (Next.js / Node.js)
  # ============================================================================
  - type: web
    name: sajhanews-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npx next start -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_API_BASE
        value: "https://sajhanews-api.onrender.com"
